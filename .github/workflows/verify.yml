name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `tests/offline-network.test.mjs` measures the offline guarantee in a real
      # browser rather than inferring it from the saved markup, so the suite needs
      # a Chromium. Only Chromium is installed; nothing here is cross-browser.
      - run: npx playwright install --with-deps chromium

      - run: npm run verify

      - run: npm run zip

      - uses: actions/upload-artifact@v5
        with:
          name: pagepack-unpacked
          path: dist/
          if-no-files-found: error
