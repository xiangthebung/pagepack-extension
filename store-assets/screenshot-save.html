<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PagePack store screenshot</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
      body { display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 58px 92px; background: radial-gradient(circle at 78% 12%, #143763 0, #1b202a 36%, #111216 72%); color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .copy { align-self: center; max-width: 570px; }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 54px; color: #f5f5f7; font-size: 20px; font-weight: 700; }
      .mark { width: 50px; height: 50px; border-radius: 14px; filter: drop-shadow(0 8px 18px rgba(0,122,255,.28)); }
      .eyebrow { color: #4da1ff; font-size: 13px; font-weight: 700; letter-spacing: .18em; }
      h1 { max-width: 570px; margin: 17px 0 23px; font-size: 61px; line-height: 1.02; font-weight: 730; letter-spacing: -.05em; }
      p { max-width: 520px; margin: 0; color: #b9bbc2; font-size: 21px; line-height: 1.55; }
      .trust { display: flex; gap: 22px; margin-top: 39px; color: #f5f5f7; font-size: 14px; font-weight: 600; }
      .trust span::before { content: "✓"; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 7px; border-radius: 50%; background: #0a84ff; color: #fff; font-size: 11px; }
      .frame { justify-self: end; width: 424px; height: 704px; padding: 21px; border: 1px solid rgba(255,255,255,.16); border-radius: 30px; background: rgba(20,21,25,.94); box-shadow: 0 34px 90px rgba(0,0,0,.46), 0 0 0 1px rgba(10,132,255,.08); }
      iframe { display: block; width: 380px; height: 662px; border: 0; border-radius: 18px; background: #1c1c1e; }
    </style>
  </head>
  <body>
    <section class="copy">
      <div class="brand"><img class="mark" src="/icons/icon.svg" alt="">PagePack</div>
      <div class="eyebrow">OFFLINE WEB CLIPPER</div>
      <h1>Keep the pages worth coming back to.</h1>
      <p>Save complete web pages to a private, on-device library—then read them without a connection.</p>
      <div class="trust"><span>Private by design</span><span>Works offline</span><span>No ads</span></div>
    </section>
    <div class="frame"><iframe src="/popup.html?plan=free" title="PagePack Save view"></iframe></div>
  </body>
</html>
